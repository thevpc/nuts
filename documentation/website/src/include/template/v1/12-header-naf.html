<!-- Header NAF -->
<header id="header" class="sticky-top">
    <nav class="primary-menu navbar navbar-expand-lg navbar-dropdown-dark">
        <div class="container-fluid">

            <button id="sidebarCollapse" class="navbar-toggler d-block d-md-none" type="button">
                <span></span><span class="w-75"></span><span class="w-50"></span>
            </button>

            <!-- Brand + version dropdown -->
            <div class="nuts-brand-wrapper d-inline-flex align-items-center">
                <a class="nuts-brand" href="{{either(assetPrefix,'')}}naf.html" title="NAF — Nuts Application Framework">
                    <img src="{{either(assetPrefix,'')}}assets/images/nuts-icon.png" alt="NAF" width="28"/>
                    <span class="nuts-brand__name">NAF</span>
                </a>
                <div class="dropdown nuts-version-dropdown-header ml-2 d-inline-block">
                    <button class="btn btn-sm dropdown-toggle nuts-version-badge" type="button" id="headerNafVersionDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        {{if (docVersion) docVersion else ('v'+latestApiVersion)}}
                    </button>
                    <div class="dropdown-menu dropdown-menu-dark" aria-labelledby="headerNafVersionDropdown">
                        <h6 class="dropdown-header text-uppercase small text-muted">Documentation Versions</h6>
                        <a class="dropdown-item {{if (!docVersion || docVersion==('v'+latestApiVersion)) 'active' else ''}}" href="{{either(assetPrefix,'')}}versions/{{('v'+latestApiVersion)}}/doc-naf.html">{{('v'+latestApiVersion)}} (Latest)</a>
                        {{:for vv:allNonLatestVersions}}
                        <a class="dropdown-item {{if (docVersion==vv) 'active' else ''}}" href="{{either(assetPrefix,'')}}versions/{{vv}}/doc-naf.html">{{vv}}</a>
                        {{:end}}

                    </div>
                </div>
            </div>

            <button class="navbar-toggler ml-auto" type="button"
                    data-toggle="collapse" data-target="#header-nav">
                <span></span><span></span><span></span>
            </button>

            <div id="header-nav" class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav nuts-nav">

                    <li class="dropdown">
                        <a class="dropdown-toggle" href="#" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Docs</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item {{ if(pageId=='doc-naf') 'not-active' else '' }}"
                                   href="{{either(assetPrefix,'')}}versions/{{('v'+latestApiVersion)}}/doc-naf.html">Developer Documentation</a></li>
                            <li><a class="dropdown-item {{ if(pageId=='doc-nuts') 'not-active' else '' }}"
                                   href="{{either(assetPrefix,'')}}versions/{{('v'+latestApiVersion)}}/doc-nuts.html">User Documentation</a></li>
                            <li><a class="dropdown-item {{ if(pageId=='doc-nuts-help') 'not-active' else '' }}"
                                   href="{{either(assetPrefix,'')}}versions/{{('v'+latestApiVersion)}}/doc-nuts-help.html">Command Help</a></li>
                            <li><a class="dropdown-item {{ if(pageId=='compatibility') 'not-active' else '' }}"
                                   href="{{either(assetPrefix,'')}}compatibility.html">API Compatibility</a></li>
                            <li><a class="dropdown-item {{ if(pageId=='contrib') 'not-active' else '' }}"
                                   href="{{either(assetPrefix,'')}}contrib.html">Contributing</a></li>
                            <li><a class="dropdown-item {{ if(pageId=='faq') 'not-active' else '' }}"
                                   href="{{either(assetPrefix,'')}}faq.html">FAQ</a></li>
                        </ul>
                    </li>

                    <li><a href="https://github.com/thevpc/nuts" target="_blank"
                           class="nuts-nav__github"><i class="fab fa-github"></i></a></li>

                    <!-- Back to Nuts -->
                    <li><a href="{{either(assetPrefix,'')}}index.html" class="nuts-nav__back-nuts">
                        &larr; Nuts Package Manager
                    </a></li>

                </ul>
            </div>

        </div>
    </nav>
</header>
<!-- Header NAF End -->
