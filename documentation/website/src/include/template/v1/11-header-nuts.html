<!-- Header -->
<header id="header" class="sticky-top">
    <nav class="primary-menu navbar navbar-expand-lg navbar-dropdown-dark">
        <div class="container-fluid">

            <!-- Mobile sidebar toggler -->
            <button id="sidebarCollapse" class="navbar-toggler d-block d-md-none" type="button">
                <span></span><span class="w-75"></span><span class="w-50"></span>
            </button>

            <!-- Logo + brand + version dropdown -->
            <div class="nuts-brand-wrapper d-inline-flex align-items-center">
                <a class="nuts-brand" href="{{either(assetPrefix,'')}}index.html" title="Nuts Package Manager">
                    <img src="{{either(assetPrefix,'')}}assets/images/nuts-icon.png" alt="Nuts" width="28"/>
                    <span class="nuts-brand__name">Nuts</span>
                </a>
                <div class="dropdown nuts-version-dropdown-header ml-2 d-inline-block">
                    <button class="btn btn-sm dropdown-toggle nuts-version-badge" type="button" id="headerVersionDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        {{if (docVersion) docVersion else 'v0.8.4'}}
                    </button>
                    <div class="dropdown-menu dropdown-menu-dark" aria-labelledby="headerVersionDropdown">
                        <h6 class="dropdown-header text-uppercase small text-muted">Documentation Versions</h6>
                        <a class="dropdown-item {{if (!docVersion || docVersion=='v0.8.4') 'active' else ''}}" href="{{either(assetPrefix,'')}}{{if (pageId=='doc-naf') 'doc-naf.html' else 'doc-nuts.html'}}">v0.8.4 (Latest)</a>
                        <a class="dropdown-item {{if (docVersion=='v0.8.3') 'active' else ''}}" href="{{either(assetPrefix,'')}}versions/v0.8.3/{{if (pageId=='doc-naf') 'doc-naf.html' else 'doc-nuts.html'}}">v0.8.3</a>
                    </div>
                </div>
            </div>

            <!-- Mobile collapse toggler -->
            <button class="navbar-toggler ml-auto" type="button"
                    data-toggle="collapse" data-target="#header-nav">
                <span></span><span></span><span></span>
            </button>

            <!-- Nav links -->
            <div id="header-nav" class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav nuts-nav">

                    <li class="dropdown">
                        <a class="dropdown-toggle" href="#">Docs</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item {{ if(pageId=='doc-nuts') 'not-active' else '' }}"
                                   href="{{either(assetPrefix,'')}}doc-nuts.html">User Documentation</a></li>
                            <li><a class="dropdown-item {{ if(pageId=='doc-naf') 'not-active' else '' }}"
                                   href="{{either(assetPrefix,'')}}doc-naf.html">Developer Documentation</a></li>
                            <li><a class="dropdown-item {{ if(pageId=='faq') 'not-active' else '' }}"
                                   href="{{either(assetPrefix,'')}}faq.html">FAQ</a></li>
                            <li><a class="dropdown-item {{ if(pageId=='contrib') 'not-active' else '' }}"
                                   href="{{either(assetPrefix,'')}}contrib.html">Contributing</a></li>
                        </ul>
                    </li>

                    <li><a href="{{either(assetPrefix,'')}}blog.html"
                           class="{{ if(pageId=='blog') 'not-active' else '' }}">Blog</a></li>

                    <li><a href="{{either(assetPrefix,'')}}apps.html"
                           class="{{ if(pageId=='apps') 'not-active' else '' }}">Apps</a></li>

                    <li><a href="{{either(assetPrefix,'')}}download.html"
                           class="{{ if(pageId=='download') 'not-active' else '' }}">Download</a></li>

                    <li><a href="https://github.com/thevpc/nuts" target="_blank"
                           class="nuts-nav__github">
                        <i class="fab fa-github"></i>
                    </a></li>

                    <li><a href="{{either(assetPrefix,'')}}naf.html" class="nuts-nav__dev-cta">For developers &rarr;</a></li>

                </ul>
            </div>

        </div>
    </nav>
</header>
<!-- Header End -->
